
services:
  postgres:
    image: postgres:16-alpine
    container_name: retailflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - retailflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailflow -d retailflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: retailflow:1.0
    container_name: retailflow-app
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retailflow
      SPRING_DATASOURCE_USERNAME: retailflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  retailflow_postgres_data:

